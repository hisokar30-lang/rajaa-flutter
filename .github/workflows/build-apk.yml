name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Scaffold native project in temp dir, then copy android/ + ios/
        run: |
          flutter create --project-name rajaa --org com.rajaa.app /tmp/rajaa_scaffold
          cp -r /tmp/rajaa_scaffold/android /tmp/rajaa_scaffold/ios .

      - name: Force Kotlin 1.9.22 everywhere in generated android/
        run: |
          python3 - <<'PY'
          import pathlib, re, glob
          KOTLIN='1.9.22'
          files = []
          for pat in ["android/settings.gradle", "android/settings.gradle.kts",
                      "android/build.gradle", "android/build.gradle.kts",
                      "android/app/build.gradle", "android/app/build.gradle.kts"]:
              if pathlib.Path(pat).exists():
                  files.append(pat)
          for f in files:
              p = pathlib.Path(f)
              t = p.read_text()
              t2 = re.sub(r'version\\s+["\']1\.\\d+\.\\d+["\'"]', 'version "%s"' % KOTLIN, t)
              t2 = re.sub(r"kotlin_version\\s*=\\s*['\"]1\\.\\d+\\.\\d+['\"]", 'kotlin_version = "%s"' % KOTLIN, t2)
              t2 = re.sub(r'kotlin-gradle-plugin:\\$kotlin_version', 'kotlin-gradle-plugin:%s' % KOTLIN, t2)
              if t2 != t:
                  p.write_text(t2)
                  print("patched", f)
              else:
                  print("no-change", f)
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rajaa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          commit_message: "Deploy Rajaa web build"
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Compute site URL
        id: site
        run: |
          echo "site_url=https://hisokar30-lang.github.io/rajaa-flutter/" >> $GITHUB_OUTPUT
          echo "branch=gh-pages" >> $GITHUB_OUTPUT

      - name: Enable GitHub Pages (repo setting)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: context.repo.repo,
            });
            // enable Pages on gh-pages branch
            const pages = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (pages.data.status !== 'active') {
              await github.rest.repos.updatePages({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'branch',
                source: { branch: 'gh-pages', path: '/' },
              });
            }
