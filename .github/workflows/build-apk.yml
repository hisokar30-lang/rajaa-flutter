name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Scaffold native project in temp dir, then copy android/ + ios/
        run: |
          flutter create --project-name rajaa --org com.rajaa.app /tmp/rajaa_scaffold
          cp -r /tmp/rajaa_scaffold/android /tmp/rajaa_scaffold/ios .

      - name: Force Kotlin 1.9.22 everywhere in generated android/
        run: |
          python3 - <<'PY'
          import pathlib, re, glob
          KOTLIN='1.9.22'
          files = []
          for pat in ["android/settings.gradle", "android/settings.gradle.kts",
                      "android/build.gradle", "android/build.gradle.kts",
                      "android/app/build.gradle", "android/app/build.gradle.kts"]:
              if pathlib.Path(pat).exists():
                  files.append(pat)
          for f in files:
              p = pathlib.Path(f)
              t = p.read_text()
              # replace any kotlin version literal (quoted) with 1.9.22
              t2 = re.sub(r'version\s+["\']1\.\d+\.\d+["\']', 'version "%s"' % KOTLIN, t)
              t2 = re.sub(r"kotlin_version\s*=\s*['\"]1\.\d+\.\d+['\"]", 'kotlin_version = "%s"' % KOTLIN, t2)
              t2 = re.sub(r'kotlin-gradle-plugin:\$kotlin_version', 'kotlin-gradle-plugin:%s' % KOTLIN, t2)
              if t2 != t:
                  p.write_text(t2)
                  print("patched", f)
              else:
                  print("no-change", f)
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rajaa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
