name: Build Android APK + Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_web:
        description: 'Build and deploy web (gh-pages)'
        type: boolean
        default: true
      build_apk:
        description: 'Build Android APK'
        type: boolean
        default: true

jobs:
  android:
    if: inputs.build_apk != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Scaffold native project in temp dir, then copy android/ + ios/
        run: |
          flutter create --project-name rajaa --org com.rajaa.app /tmp/rajaa_scaffold
          cp -r /tmp/rajaa_scaffold/android /tmp/rajaa_scaffold/ios .

      - name: Force Kotlin 1.9.22 everywhere in generated android/
        run: |
          python3 - <<'PY'
          import pathlib, re
          KOTLIN='1.9.22'
          for pat in ["android/settings.gradle", "android/settings.gradle.kts",
                      "android/build.gradle", "android/build.gradle.kts",
                      "android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = pathlib.Path(pat)
              if not p.exists():
                  continue
              t = p.read_text()
              t = re.sub(r'version\s+["\']1\.\d+\.\d+["\']', 'version "%s"' % KOTLIN, t)
              t = re.sub(r"kotlin_version\s*=\s*['\"]1\.\d+\.\d+['\"]", 'kotlin_version = "%s"' % KOTLIN, t)
              t = re.sub(r'kotlin-gradle-plugin:\$kotlin_version', 'kotlin-gradle-plugin:%s' % KOTLIN, t)
              if t != p.read_text():
                  p.write_text(t)
                  print("patched", pat)
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rajaa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_web != 'false') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /rajaa-flutter/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          commit_message: "Deploy Rajaa web build [skip ci]"
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enable / verify GitHub Pages (gh-pages branch)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pages = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (pages.data.status !== 'active') {
              await github.rest.repos.updatePages({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'branch',
                source: { branch: 'gh-pages', path: '/' },
              });
            }
