name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Scaffold native project in temp dir, then copy android/ + ios/
        run: |
          flutter create --project-name rajaa --org com.rajaa.app /tmp/rajaa_scaffold
          cp -r /tmp/rajaa_scaffold/android /tmp/rajaa_scaffold/ios .

      - name: Pin Kotlin 1.9.22 (format-agnostic)
        run: |
          python3 - <<'PY'
          import pathlib, re
          KOTLIN='1.9.22'
          # settings.gradle / .kts : ensure kotlin android plugin pin inside plugins block
          for f in ["android/settings.gradle", "android/settings.gradle.kts"]:
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              t = p.read_text()
              if 'org.jetbrains.kotlin.android' not in t:
                  # insert right after the first occurrence of "plugins {"
                  t = re.sub(r'plugins\s*\{',
                             'plugins {\n    id "org.jetbrains.kotlin.android" version "%s" apply false' % KOTLIN,
                             t, count=1)
                  p.write_text(t)
                  print("patched", f)
              else:
                  print("kotlin already pinned in", f)

          # root build.gradle / .kts : force ext.kotlin_version so the app module uses it
          for f in ["android/build.gradle", "android/build.gradle.kts"]:
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              t = p.read_text()
              if 'kotlin_version' not in t:
                  if 'buildscript {' in t:
                      t = t.replace('buildscript {',
                                    'buildscript {\n    ext.kotlin_version = "%s"' % KOTLIN, 1)
                  else:
                      t = 'buildscript {\n    ext.kotlin_version = "%s"\n}\n\n' % KOTLIN + t
                  p.write_text(t)
                  print("patched", f)
              else:
                  print("kotlin_version present in", f)
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rajaa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
