name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Scaffold native project in temp dir, then copy android/ + ios/
        run: |
          flutter create --project-name rajaa --org com.rajaa.app /tmp/rajaa_scaffold
          cp -r /tmp/rajaa_scaffold/android /tmp/rajaa_scaffold/ios .

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rajaa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
